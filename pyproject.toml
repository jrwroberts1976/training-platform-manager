[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-platform-manager"
version = "0.5.0"
description = "Manage and scaffold engineering training repositories"
requires-python = ">=3.11"

[project.scripts]
training-manager = "training_manager.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
